name: Tests and Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
      - name: Installing dependencies
        run: yarn install --frozen-lockfile
      - name: Running tests
        run: yarn test --ci
      - name: Building
        run: yarn build

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # trusted publishing (OIDC) do npm
      id-token: write
    env:
      # o .npmrc gerado pelo setup-node referencia ${NODE_AUTH_TOKEN}; o yarn falha se ela não existir
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: yarn
          registry-url: 'https://registry.npmjs.org'
      - name: Installing dependencies
        run: yarn install --frozen-lockfile
      - name: Checking if version is already published
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if curl -sf "https://registry.npmjs.org/validator-brasil/$VERSION" > /dev/null; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      # o token é "stage only": a versão fica pendente até ser aprovada com `npm stage approve <id> --otp`
      - name: Staging
        if: steps.version.outputs.publish == 'true'
        run: npm stage publish
